<h1>Doubler!</h1>
<input type="text" id="input" placeholder="Put your number here!">
<button onclick="doubler()">Double It!</button>
<p id="output"></p>
<script>
  const input = document.getElementById("input");
  const output = document.getElementById("output");
  function doubler() {
    let val = input.value;
    if (Number(val)) {
      output.innerHTML = Number(val)*2;
    } else {
      output.innerHTML = "Not a number!";
    }
  }
  </script>
