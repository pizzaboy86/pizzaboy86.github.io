
<style>
  .day-btn { cursor: pointer; padding: 6px 18px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: var(--color-background-primary); color: var(--color-text-primary); font-size: 13px; font-family: var(--font-sans); }
  .day-btn.active { background: var(--color-background-info); color: var(--color-text-info); border-color: var(--color-border-info); }
  .habit-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 0.5px solid var(--color-border-tertiary); }
  .check-btn { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--color-border-secondary); background: transparent; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .check-btn.done { background: #1D9E75; border-color: #1D9E75; color: white; }
  .stat-pill { font-size: 12px; padding: 2px 10px; border-radius: 20px; background: var(--color-background-secondary); color: var(--color-text-secondary); }
</style>

<h2 class="sr-only">Healthy life simulation: track daily habits over a week and watch your wellness grow.</h2>

<div style="padding: 1.5rem 0 0;">

  <svg width="100%" viewBox="0 0 680 160" role="img">
    <title>Wellness garden</title>
    <desc>A peaceful garden scene that grows greener as you complete healthy habits.</desc>
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <!-- Sky -->
    <rect x="0" y="0" width="680" height="110" fill="#E6F1FB"/>

    <!-- Sun -->
    <circle id="sun" cx="80" cy="48" r="22" fill="#FAC775"/>
    <g stroke="#EF9F27" stroke-width="2" stroke-linecap="round">
      <line x1="80" y1="18" x2="80" y2="10"/>
      <line x1="80" y1="78" x2="80" y2="86"/>
      <line x1="50" y1="48" x2="42" y2="48"/>
      <line x1="110" y1="48" x2="118" y2="48"/>
      <line x1="60" y1="28" x2="54" y2="22"/>
      <line x1="100" y1="68" x2="106" y2="74"/>
      <line x1="100" y1="28" x2="106" y2="22"/>
      <line x1="60" y1="68" x2="54" y2="74"/>
    </g>

    <!-- Clouds -->
    <g fill="white" opacity="0.85">
      <ellipse cx="200" cy="35" rx="38" ry="18"/>
      <ellipse cx="225" cy="30" rx="28" ry="14"/>
      <ellipse cx="178" cy="33" rx="22" ry="12"/>
      <ellipse cx="500" cy="42" rx="30" ry="14"/>
      <ellipse cx="522" cy="37" rx="22" ry="11"/>
    </g>

    <!-- Ground -->
    <rect x="0" y="110" width="680" height="50" fill="#C0DD97"/>

    <!-- Trees -->
    <g>
      <rect x="148" y="80" width="10" height="34" fill="#854F0B"/>
      <ellipse cx="153" cy="68" rx="22" ry="26" fill="#3B6D11"/>
      <ellipse cx="153" cy="60" rx="15" ry="18" fill="#639922"/>
    </g>
    <g>
      <rect x="508" y="85" width="10" height="28" fill="#854F0B"/>
      <ellipse cx="513" cy="72" rx="20" ry="22" fill="#3B6D11"/>
      <ellipse cx="513" cy="65" rx="14" ry="15" fill="#639922"/>
    </g>

    <!-- Flowers -->
    <g id="flowers">
      <circle cx="280" cy="108" r="6" fill="#F4C0D1"/>
      <circle cx="280" cy="108" r="3" fill="#FAC775"/>
      <rect x="278" y="110" width="4" height="10" fill="#3B6D11"/>

      <circle cx="340" cy="106" r="7" fill="#9FE1CB"/>
      <circle cx="340" cy="106" r="3" fill="#FAC775"/>
      <rect x="338" y="111" width="4" height="11" fill="#3B6D11"/>

      <circle cx="400" cy="109" r="6" fill="#CECBF6"/>
      <circle cx="400" cy="109" r="3" fill="#FAC775"/>
      <rect x="398" y="111" width="4" height="10" fill="#3B6D11"/>

      <circle cx="460" cy="107" r="7" fill="#F5C4B3"/>
      <circle cx="460" cy="107" r="3" fill="#FAC775"/>
      <rect x="458" y="111" width="4" height="11" fill="#3B6D11"/>
    </g>

    <!-- Person (simple) -->
    <g id="person" transform="translate(330, 52)">
      <circle cx="0" cy="0" r="11" fill="#FAC775" stroke="#BA7517" stroke-width="1"/>
      <rect x="-9" y="12" width="18" height="22" rx="4" fill="#185FA5"/>
      <line x1="-9" y1="18" x2="-20" y2="32" stroke="#FAC775" stroke-width="3" stroke-linecap="round"/>
      <line x1="9" y1="18" x2="20" y2="32" stroke="#FAC775" stroke-width="3" stroke-linecap="round"/>
      <line x1="-5" y1="34" x2="-5" y2="50" stroke="#185FA5" stroke-width="4" stroke-linecap="round"/>
      <line x1="5" y1="34" x2="5" y2="50" stroke="#185FA5" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Wellness score bar -->
    <rect x="30" y="135" width="620" height="12" rx="6" fill="white" opacity="0.5"/>
    <rect id="wellness-bar" x="30" y="135" width="62" height="12" rx="6" fill="#1D9E75"/>
    <text x="340" y="145" text-anchor="middle" class="ts" fill="#27500A" font-weight="500" id="bar-label">10% — keep going!</text>
  </svg>

  <!-- Day selector -->
  <div style="display: flex; gap: 8px; flex-wrap: wrap; margin: 1.25rem 0 1rem;">
    <button class="day-btn active" onclick="selectDay(0)">Mon</button>
    <button class="day-btn" onclick="selectDay(1)">Tue</button>
    <button class="day-btn" onclick="selectDay(2)">Wed</button>
    <button class="day-btn" onclick="selectDay(3)">Thu</button>
    <button class="day-btn" onclick="selectDay(4)">Fri</button>
    <button class="day-btn" onclick="selectDay(5)">Sat</button>
    <button class="day-btn" onclick="selectDay(6)">Sun</button>
    <span id="streak-badge" class="stat-pill" style="margin-left: auto; align-self: center;">🌱 0 day streak</span>
  </div>

  <!-- Habits -->
  <div id="habits-list"></div>

  <!-- Message -->
  <div id="msg" style="margin-top: 1rem; min-height: 28px; font-size: 14px; color: var(--color-text-secondary);"></div>
</div>

<script>
const habits = [
  { id: "sleep",    icon: "ti-moon",         label: "Sleep 8 hours",        xp: 15 },
  { id: "water",    icon: "ti-droplet",      label: "Drink 8 glasses of water", xp: 10 },
  { id: "exercise", icon: "ti-run",          label: "Move your body 30 min", xp: 20 },
  { id: "veggies",  icon: "ti-salad",        label: "Eat fruits & veggies",  xp: 15 },
  { id: "screen",   icon: "ti-device-laptop","label": "1 hr screen-free time", xp: 10 },
  { id: "grateful", icon: "ti-heart",        label: "Write one thing you're grateful for", xp: 10 },
  { id: "outside",  icon: "ti-sun",          label: "Spend time outside",    xp: 20 },
];

const TOTAL_XP = habits.reduce((a, h) => a + h.xp, 0) * 7;
const state = Array.from({ length: 7 }, () => ({}));
let currentDay = 0;

const msgs = [
  "Every small step counts — you're doing great!",
  "Your body thanks you for taking care of it.",
  "Consistency is the secret to a healthy life.",
  "One healthy choice leads to another.",
  "You're building habits that last a lifetime.",
  "Health is wealth — well done!",
  "A little progress every day adds up to big results.",
];

function totalXP() {
  return state.reduce((sum, day) => {
    return sum + habits.reduce((s, h) => s + (day[h.id] ? h.xp : 0), 0);
  }, 0);
}

function streak() {
  let s = 0;
  for (let d = 6; d >= 0; d--) {
    const allDone = habits.every(h => state[d][h.id]);
    if (allDone) s++; else break;
  }
  return s;
}

function renderHabits() {
  const list = document.getElementById("habits-list");
  list.innerHTML = habits.map(h => `
    <div class="habit-row">
      <button class="check-btn ${state[currentDay][h.id] ? 'done' : ''}" onclick="toggle('${h.id}')">
        ${state[currentDay][h.id] ? '<i class="ti ti-check" aria-hidden="true"></i>' : ''}
      </button>
      <i class="ti ${h.icon}" style="font-size:18px;color:var(--color-text-secondary)" aria-hidden="true"></i>
      <span style="flex:1;font-size:14px;color:var(--color-text-primary);${state[currentDay][h.id] ? 'text-decoration:line-through;opacity:0.5' : ''}">${h.label}</span>
      <span class="stat-pill">+${h.xp} pts</span>
    </div>
  `).join('');
}

function updateVisuals() {
  const xp = totalXP();
  const pct = Math.round(xp / TOTAL_XP * 100);
  const barW = Math.round(pct / 100 * 620);
  document.getElementById("wellness-bar").setAttribute("width", Math.max(20, barW));
  document.getElementById("bar-label").textContent = pct + "% wellness — " + (pct < 30 ? "keep going!" : pct < 70 ? "great progress!" : "amazing work!");

  const st = streak();
  document.getElementById("streak-badge").textContent = (st > 0 ? "🔥" : "🌱") + " " + st + " day streak";

  const allToday = habits.every(h => state[currentDay][h.id]);
  document.getElementById("msg").textContent = allToday
    ? "✨ All habits done today — you're thriving!"
    : msgs[Math.floor(Math.random() * msgs.length)];

  // Person animation
  const person = document.getElementById("person");
  const baseY = 52 - Math.round(pct / 100 * 12);
  person.setAttribute("transform", `translate(330, ${baseY})`);
}

function toggle(id) {
  state[currentDay][id] = !state[currentDay][id];
  renderHabits();
  updateVisuals();
}

function selectDay(d) {
  currentDay = d;
  document.querySelectorAll(".day-btn").forEach((b, i) => b.classList.toggle("active", i === d));
  renderHabits();
  updateVisuals();
}

renderHabits();
updateVisuals();
</script>
